name: wasm-sleep-repro

on:
  push:
  workflow_dispatch:

jobs:
  repro:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-15]
        emscripten: ["5.0.5", "5.0.6", "5.0.7"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Emscripten ${{ matrix.emscripten }}
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install ${{ matrix.emscripten }}
          ./emsdk activate ${{ matrix.emscripten }}

      - name: Build
        run: |
          source emsdk/emsdk_env.sh
          echo "emcc: $(emcc --version | head -1)"
          em++ -pthread -o test_sleep.js test_sleep.cpp

      - name: Test (emsdk node)
        run: |
          source emsdk/emsdk_env.sh
          echo "node: $($EMSDK_NODE --version)"
          $EMSDK_NODE test_sleep.js

      - name: Test (system node)
        run: |
          echo "node: $(node --version)"
          node test_sleep.js

      - name: Setup Node.js 21
        uses: actions/setup-node@v4
        with:
          node-version: 21
      - name: Test (node 21)
        run: |
          echo "node: $(node --version)"
          node test_sleep.js

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test (node 22)
        run: |
          echo "node: $(node --version)"
          node test_sleep.js

      - name: Setup Node.js 23
        uses: actions/setup-node@v4
        with:
          node-version: 23
      - name: Test (node 23)
        run: |
          echo "node: $(node --version)"
          node test_sleep.js
